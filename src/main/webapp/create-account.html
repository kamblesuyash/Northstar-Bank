<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open an account | Northstar Bank</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="app-page">
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">N</span><span>Northstar <small>Bank</small></span></a><div class="header-actions"><a class="text-link" href="login.html">Already a customer? Sign in <span aria-hidden="true">→</span></a></div></header>
<main class="form-page">
    <div class="page-heading"><span class="eyebrow">A FRESH START</span><h1>Open your account</h1><p>It only takes a moment. Fields marked <span class="required-mark">*</span> are required.</p></div>
    <section class="content-card">
        <form data-form="create-account" novalidate>
            <div class="form-grid">
                <div class="field"><label for="fullName">Full name <span class="required-mark">*</span></label><input id="fullName" name="fullName" maxlength="120" autocomplete="name" required></div>
                <div class="field"><label for="dob">Date of birth <span class="required-mark">*</span></label><input id="dob" name="dob" type="date" required></div>
                <div class="field"><label for="gender">Gender <span class="required-mark">*</span></label><select id="gender" name="gender" required><option value="">Select</option><option value="FEMALE">Female</option><option value="MALE">Male</option><option value="OTHER">Other / Prefer not to say</option></select></div>
                <div class="field"><label for="mobile">Mobile number <span class="required-mark">*</span></label><input id="mobile" name="mobile" type="tel" maxlength="20" autocomplete="tel" placeholder="+91 98765 43210" required></div>
                <div class="field"><label for="email">Email address <span class="required-mark">*</span></label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required></div>
                <div class="field"><label for="accountType">Account type <span class="required-mark">*</span></label><select id="accountType" name="accountType" required><option value="">Select account type</option><option value="SAVINGS">Savings</option><option value="CURRENT">Current</option></select></div>
                <div class="field field-wide"><label for="address">Address <span class="required-mark">*</span></label><textarea id="address" name="address" rows="3" maxlength="500" autocomplete="street-address" required></textarea></div>
                <div class="field"><label for="initialDeposit">Initial deposit (₹) <span class="required-mark">*</span></label><input id="initialDeposit" name="initialDeposit" type="number" min="0" max="9999999999999.99" step="0.01" value="0.00" required></div>
                <div class="field"><label for="password">Create password <span class="required-mark">*</span></label><input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><small>Use 8–128 characters.</small></div>
            </div>
            <p class="form-message" role="status" aria-live="polite"></p>
            <div class="form-actions"><button class="button button-primary" type="submit">Create account <span aria-hidden="true">→</span></button><a class="button button-quiet" href="index.html">Cancel</a></div>
        </form>
    </section>
</main>
<footer class="landing-footer"><span>© 2026 Northstar Bank</span><span>For academic demonstration only</span></footer>
</body>
</html>
